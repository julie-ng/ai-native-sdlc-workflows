name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Install Argo and kubectl
        env:
          ARGO_VERSION: v4.1.6
          KUBECTL_VERSION: v1.35.0
        run: |
          cd "$(mktemp -d)"
          argo_release="https://github.com/argoproj/argo-workflows/releases/download/$ARGO_VERSION"
          curl -fsSLO "$argo_release/argo-linux-amd64.gz"
          curl -fsSLO "$argo_release/argo-workflows-cli-checksums.txt"
          sha256sum --check --ignore-missing argo-workflows-cli-checksums.txt
          gunzip argo-linux-amd64.gz
          sudo install -m 0755 argo-linux-amd64 /usr/local/bin/argo

          kubectl_release="https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64"
          curl -fsSLO "$kubectl_release/kubectl"
          curl -fsSLO "$kubectl_release/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
      - name: Lint Argo templates and rendered ConfigMap bundle
        run: |
          argo lint --offline templates/
          kubectl kustomize . > "$RUNNER_TEMP/foreman-manifests.yaml"
          argo lint --offline "$RUNNER_TEMP/foreman-manifests.yaml"

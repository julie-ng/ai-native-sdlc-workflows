apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
resources:
  - templates/foreman.yaml
  - templates/initial-release.yaml
configMapGenerator:
  - name: foreman-scripts
    files:
      - scripts/foreman.ts
  - name: initial-release-recipes
    files:
      - recipes/planner.yaml
      - recipes/coder.yaml
generatorOptions:
  # The mount lives inside an Argo template, outside Kustomize's Pod references.
  disableNameSuffixHash: true

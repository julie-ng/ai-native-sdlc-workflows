apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
resources:
  - templates/foreman-test.yaml
configMapGenerator:
  - name: foreman-scripts
    files:
      - scripts/foreman.sh
generatorOptions:
  # The mount lives inside an Argo template, outside Kustomize's Pod references.
  disableNameSuffixHash: true
